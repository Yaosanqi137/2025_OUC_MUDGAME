# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake Build and Release

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      
  pull_request:
    branches: [ '**' ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'

env:
  PROJECT_NAME: BoxingGame

jobs:
  # Job 1: 统一的、跨平台的构建与测试 Job
  build:
    strategy:
      # 使用矩阵，为每个操作系统并行运行此 Job
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ cmake libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgpm-dev zip

    - name: Determine Build Type
      id: build_type
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.ref_type }}" == "branch" ]]; then
          echo "type=Debug" >> $GITHUB_OUTPUT
        else
          echo "type=Release" >> $GITHUB_OUTPUT
        fi

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build

    - name: Build with CMake
      run: cmake --build ${{github.workspace}}/build --config ${{ steps.build_type.outputs.type }}

    - name: Install Artifacts
      # CMake 会自动从正确的 Debug/Release 目录中找到文件并安装
      run: cmake --install ${{github.workspace}}/build --config ${{ steps.build_type.outputs.type }} --prefix ${{github.workspace}}/output

    - name: Package Artifact
      id: package
      shell: bash
      run: |
        # 根据事件类型和平台确定文件名
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          VERSION="${{ github.ref_name }}"
        else
          VERSION="nightly"
        fi
        
        # 处理 Windows 的 .exe 后缀
        EXT=""
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          EXT=".exe"
        fi

        # 定义可执行文件的路径
        EXE_PATH="output/bin/${{ env.PROJECT_NAME }}${EXT}"
  
        # 处理权限问题
        if [[ "${{ runner.os }}" != "Windows" ]]; then
        echo "Adding execute permissions to ${EXE_PATH}"
        chmod +x "${EXE_PATH}"
        fi
        
        # 准备打包目录
        mkdir staging
        cp "${EXE_PATH}" staging/
        cp README.md staging/
        cp LICENSE staging/

        # 创建 zip 包
        ZIP_NAME="${{ env.PROJECT_NAME }}-${VERSION}-${{ runner.os }}.zip"
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          powershell "Compress-Archive -Path staging\* -DestinationPath ${ZIP_NAME}"
        else
          (cd staging && zip -r ../${ZIP_NAME} .)
        fi
        
        echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        # 为每个平台的 artifact 使用唯一的名称
        name: ${{ steps.package.outputs.zip_name }}
        path: ${{ steps.package.outputs.zip_name }}

  # Job 2: 发布每夜版
  publish-nightly:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        path: .

    - name: Get Short SHA
      id: short_sha
      run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
      
    - name: Create or Update Nightly Release
      uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "nightly"
        prerelease: true
        title: "Nightly Build (Branch [${{ github.ref_name }}] - ${{ steps.short_sha.outputs.sha }})"
        # 使用通配符上传所有平台的 zip 包
        files: "**/*.zip"

  # Job 3: 发布正式版
  publish-release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        path: .

    - name: Create new GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        prerelease: false
        # 使用通配符上传所有平台的 zip 包
        files: "**/*.zip"
